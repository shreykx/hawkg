<div
  x-show="notification.visible"
  class="fixed inset-0 w-full h-full bg-black/40 z-100 flex items-center justify-center"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @click.self="notification.shake = true; setTimeout(() => notification.shake = false, 100)"
>
  <div
    class="bg-white rounded-xl shadow transition-scale duration-100"
    :class="{ 'modal-bounce': notification.shake }"
    x-transition
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
  >
    <div class="p-2">
      <h1 class="text-xl font-bold" x-text="notification.title"></h1>
    </div>
    <div class="px-2">
      <p x-text="notification.message"></p>
    </div>
    <div class="p-2 flex justify-end">
      <button
        type="button"
        @click="notification.visible = false"
        class="px-8 py-2 hover:bg-orange-500 rounded-lg hover:text-white text-orange-500 border border-orange-400 active:scale-[0.9] transition-scale duration-150"
      >
        Ok
      </button>
    </div>
  </div>
</div>
