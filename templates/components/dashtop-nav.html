<div class="px-4 py-2">
  <div
    class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"
  >
    <div class="flex items-center justify-between md:w-1/3 md:justify-start">
      <a href="/dashboard" class="block focus:outline-none text-orange-600">
        <h1 class="text-4xl font-bold leading-none">hawkg</h1>
      </a>

      <div class="flex items-center gap-2 md:hidden">
        <button
          type="button"
          @click="quizMakerVars.openQuizMaker();"
          class="px-3 py-2 rounded-full border-2 border-orange-400 hover:bg-orange-200 cursor-pointer active:scale-[0.95] transition-transform duration-100 shadow flex items-center gap-2"
        >
          <i
            data-lucide="message-circle-plus"
            class="text-orange-500 w-5 h-5"
          ></i>
          <span class="text-orange-500 font-semibold">Build</span>
        </button>

        <button
          type="button"
          data-profile-avatar
          @click="toggleProfileMenu()"
          class="w-10 h-10 rounded-full overflow-hidden border-2 border-orange-400 cursor-pointer active:scale-[0.95] transition-transform duration-100 flex items-center justify-center bg-orange-100"
        >
          {% if user.profile_image %}
          <img
            src="{{ user.profile_image }}"
            alt="Profile"
            class="w-full h-full object-cover"
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.style.display = 'flex';
            "
          />
          <div
            class="w-full h-full items-center justify-center bg-orange-100 text-orange-600 font-semibold hidden"
          >
            {% set initials = user.display_name.split() | map('first') | list %}
            {{ (initials[:2] | join('')) | upper }}
          </div>
          {% else %}
          <div
            class="w-full h-full flex items-center justify-center bg-orange-100 text-orange-600 font-semibold"
          >
            {% set initials = user.display_name.split() | map('first') | list %}
            {{ (initials[:2] | join('')) | upper }}
          </div>
          {% endif %}
        </button>
      </div>
    </div>

    <div class="w-full md:w-1/3">
      <div
        class="bg-gray-100 flex items-center w-full transition-all duration-100 px-2 py-1 rounded-lg focus-within:outline-3 outline-orange-500 focus-within:bg-white focus-within:shadow-sm"
      >
        <i data-lucide="search" class="text-gray-400 w-6.5 h-6.5"></i>
        <input
          type="text"
          x-ref="search"
          placeholder="Search..."
          class="w-full px-4 py-2 outline-none bg-transparent"
        />
      </div>
    </div>

    <div
      class="hidden md:flex md:w-1/3 md:justify-end md:items-center md:gap-3"
    >
      <button
        type="button"
        @click="quizMakerVars.openQuizMaker();"
        class="px-4 py-2 outline-orange-500 rounded-full border-2 border-orange-400 hover:bg-orange-200 cursor-pointer active:scale-[0.95] transition-transform duration-100 shadow flex items-center gap-2"
      >
        <i
          data-lucide="message-circle-plus"
          class="text-orange-500 w-5 h-5"
        ></i>
        <span class="text-orange-500 font-semibold">Build new Quiz</span>
      </button>

      <button
        type="button"
        data-profile-avatar
        @click="toggleProfileMenu()"
        class="w-10 h-10 rounded-full overflow-hidden border-2 border-orange-400 cursor-pointer active:scale-[0.95] transition-transform duration-100 flex items-center justify-center bg-orange-100"
      >
        {% if user.profile_image %}
        <img
          src="{{ user.profile_image }}"
          alt="Profile"
          class="w-full h-full object-cover"
          onerror="
            this.style.display = 'none';
            this.nextElementSibling.style.display = 'flex';
          "
        />
        <div
          class="w-full h-full items-center justify-center bg-orange-100 text-orange-600 font-semibold hidden"
        >
          {% set initials = user.display_name.split() | map('first') | list %}
          {{ (initials[:2] | join('')) | upper }}
        </div>
        {% else %}
        <div
          class="w-full h-full flex items-center justify-center bg-orange-100 text-orange-600 font-semibold"
        >
          {% set initials = user.display_name.split() | map('first') | list %}
          {{ (initials[:2] | join('')) | upper }}
        </div>
        {% endif %}
      </button>
    </div>
  </div>
</div>
