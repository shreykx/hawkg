<template x-if="quizData">
  <section class="mx-auto w-full max-w-[850px] p-6">
    <div class="mb-5 flex items-center justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold">Questions</h2>
        <p class="text-sm text-gray-600">All questions are free-form text.</p>
      </div>

      <button
        type="button"
        class="rounded-xl bg-orange-500 px-4 py-2 font-bold text-white hover:bg-orange-600 active:opacity-80 cursor-pointer"
        @click="addQuestion()"
      >
        Add question
      </button>
    </div>

    <p
      x-show="!quizData.questions?.length"
      class="rounded-xl border-2 border-dashed border-gray-200 p-8 text-center text-sm text-gray-500"
    >
      Add your first question to get started.
    </p>

    <div class="space-y-4">
      <template x-for="(question, index) in quizData.questions" :key="question.clientId">
        <article class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
          <div class="mb-3 flex items-center justify-between gap-4">
            <p class="font-bold text-gray-700" x-text="`Question ${index + 1}`"></p>

            <div class="flex items-center gap-1">
              <button
                type="button"
                class="rounded-md px-2 py-1 text-gray-600 hover:bg-gray-100 disabled:opacity-30 cursor-pointer"
                @click="moveQuestion(index, -1)"
                :disabled="index === 0"
                aria-label="Move question up"
              >
                <i data-lucide="chevron-up" class="h-4 w-4"></i>
              </button>
              <button
                type="button"
                class="rounded-md px-2 py-1 text-gray-600 hover:bg-gray-100 disabled:opacity-30 cursor-pointer"
                @click="moveQuestion(index, 1)"
                :disabled="index === quizData.questions.length - 1"
                aria-label="Move question down"
              >
                <i data-lucide="chevron-down" class="h-4 w-4"></i>
              </button>
              <button
                type="button"
                class="ml-2 rounded-md px-2 py-1 text-red-600 hover:bg-red-50 cursor-pointer"
                @click="deleteQuestion(index)"
              >
                Delete
              </button>
            </div>
          </div>

          <textarea
            x-model="question.prompt"
            rows="3"
            placeholder="Write your question"
            class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 outline-orange-500 focus:border-orange-500"
          ></textarea>
        </article>
      </template>
    </div>
  </section>
</template>
