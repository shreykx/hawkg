<div
  x-show="true"
  class="w-full h-full hidden sm:block shadow-sm shrink-0 px-5 pt-2"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-x-4"
  x-transition:enter-end="opacity-100 translate-x-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-x-0"
  x-transition:leave-end="opacity-0 translate-x-4"
>
  <template x-if="quizData">
    <div>
      <h1 class="text-md font-semibold">Preferences</h1>

      <p class="text-gray-600 text-sm">
        You can later change the information here.
      </p>

      <div class="py-4 space-y-4">
        <!-- Title -->
        <div>
          <label class="block text-sm font-bold mb-2">
            Title <span class="text-red-500">*</span>
          </label>

          <input
            type="text"
            x-model="quizData.title"
            placeholder="Quiz title"
            required
            class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-orange-500 focus:border-orange-500"
          />

          <p
            x-show="!quizData.title || !quizData.title.trim()"
            class="mt-1 text-xs text-red-500"
          >
            Title is required.
          </p>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-bold mb-2"> Description </label>

          <textarea
            x-model="quizData.description"
            placeholder="Quiz description"
            rows="3"
            class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-orange-500 focus:border-orange-500 resize-none"
          ></textarea>
        </div>

        <!-- Banner Image -->
        <div>
          <label class="block text-sm font-bold mb-2"> Banner image </label>

          <input
            type="text"
            x-model="quizData.banner_image"
            placeholder="Banner image URL"
            class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-orange-500 focus:border-orange-500"
          />

          <template x-if="quizData.banner_image">
            <img
              :src="quizData.banner_image"
              :alt="quizData.title"
              class="mt-2 w-full aspect-[2/1] object-cover rounded-lg"
            />
          </template>
        </div>

        <!-- Visibility -->
        <div>
          <label class="block text-sm font-bold mb-2"> Visibility </label>

          <select
            x-model="quizData.visibility"
            class="px-4 py-2 w-full border border-gray-100 hover:bg-gray-200 outline-orange-500 rounded-lg"
          >
            <option value="public">Public</option>
            <option value="unlisted">Unlisted</option>
          </select>
        </div>

        <!-- Actions -->
        <div class="flex gap-2 mt-2">
          <button
            type="button"
            class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 active:opacity-[0.8] cursor-pointer text-red-600 font-bold rounded-xl"
          >
            Discard
          </button>

          <button
            type="button"
            class="flex-1 px-4 py-2 bg-orange-500 hover:bg-orange-600 active:opacity-[0.8] cursor-pointer text-white font-bold rounded-xl disabled:opacity-50 disabled:cursor-not-allowed"
            @click="saveQuiz()"
            :disabled="saving || !quizData?.title || !quizData.title.trim()"
          >
            <span x-show="!saving">Save</span>
            <span x-show="saving">Saving...</span>
          </button>
        </div>

        <button
          type="button"
          class="mt-2 w-full px-4 py-2 border border-red-200 text-red-600 hover:bg-red-50 active:opacity-[0.8] cursor-pointer font-bold rounded-xl disabled:opacity-50 disabled:cursor-not-allowed"
          @click="deleteQuiz()"
          :disabled="saving || deleting"
        >
          <span x-show="!deleting">Delete quiz</span>
          <span x-show="deleting">Deleting...</span>
        </button>
      </div>
    </div>
  </template>
</div>
